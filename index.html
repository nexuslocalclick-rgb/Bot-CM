<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Técnico - Chevy Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="w-full max-w-lg bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 md:p-8">
        
        <div class="flex items-center justify-between border-b border-slate-700 pb-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-amber-500 tracking-wide">Chevy Master</h1>
                <p class="text-xs text-slate-400">Asistencia Técnica en Taller</p>
            </div>
            <div class="bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs px-3 py-1 rounded-full font-semibold">
                Soporte en Línea
            </div>
        </div>

        <!-- Aquí se mostrará la respuesta de la IA (agregamos whitespace-pre-wrap para respetar saltos de línea) -->
        <div id="alertBox" class="hidden mb-4 p-4 rounded-xl text-sm font-medium whitespace-pre-wrap"></div>

        <form id="supportForm" class="space-y-4">
            
            <div>
                <label for="mechanicId" class="block text-sm font-medium text-slate-300 mb-1">ID del Mecánico</label>
                <input type="text" id="mechanicId" required placeholder="Ej. MEC-04" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition">
            </div>

            <div>
                <label for="carModel" class="block text-sm font-medium text-slate-300 mb-1">Marca y Modelo del Auto</label>
                <input type="text" id="carModel" required placeholder="Ej. Chevrolet Chevy C2 2008" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition">
            </div>

            <div>
                <label for="supportType" class="block text-sm font-medium text-slate-300 mb-1">Categoría del Apoyo</label>
                <select id="supportType" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition">
                    <option value="diagnostico">Asistencia en Diagnóstico / Escáner</option>
                    <option value="mecanico">Apoyo Mecánico / Fuerza adicional</option>
                    <option value="diagrama">Consulta de Diagrama / Información Técnica</option>
                    <option value="refacciones">Confirmación de Refacción</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label for="issueDescription" class="block text-sm font-medium text-slate-300">Descripción de la Falla</label>
                    <button type="button" id="recordAudioBtn" class="text-xs bg-slate-700 hover:bg-slate-600 text-amber-400 px-2.5 py-1 rounded-lg border border-slate-600 transition flex items-center space-x-1">
                        <span id="micIcon">🎙️</span>
                        <span id="recordText">Grabar por Voz</span>
                    </button>
                </div>
                <textarea id="issueDescription" rows="3" required placeholder="Describe el problema, código DTC o dicta por voz..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition resize-none"></textarea>
                <p id="audioStatus" class="text-xs text-amber-400/80 mt-1 hidden">🔴 Grabando audio... Habla ahora.</p>
            </div>

            <div>
                <label for="evidenceFiles" class="block text-sm font-medium text-slate-300 mb-1">Adjuntar Fotos o Evidencia (Opcional)</label>
                <input type="file" id="evidenceFiles" accept="image/*" multiple 
                    class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-600 file:cursor-pointer transition">
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-6 rounded-xl shadow-lg transition duration-200 transform active:scale-95 flex items-center justify-center space-x-2">
                <span id="btnText">Enviar Solicitud al Servidor</span>
                <svg id="spinner" class="hidden animate-spin h-5 w-5 text-slate-950" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

        <p class="text-xs text-center text-slate-500 mt-6">Sistema Interno Operativo — Chevy Master</p>
    </div>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE ENTORNOS
        // ==========================================
        const WEBHOOK_URL = 'https://core.localclick.com.mx/webhook/cliente';

        const form = document.getElementById('supportForm');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const recordAudioBtn = document.getElementById('recordAudioBtn');
        const recordText = document.getElementById('recordText');
        const audioStatus = document.getElementById('audioStatus');
        const issueDescription = document.getElementById('issueDescription');
        const evidenceFiles = document.getElementById('evidenceFiles');

        // Funcionalidad de Reconocimiento de Voz
        let recognition = null;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'es-MX';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                audioStatus.classList.remove('hidden');
                recordText.textContent = 'Escuchando...';
            };

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                issueDescription.value += (issueDescription.value ? ' ' : '') + speechToText;
            };

            recognition.onerror = (event) => {
                console.error('Error en reconocimiento de voz:', event.error);
                audioStatus.classList.add('hidden');
                recordText.textContent = 'Grabar por Voz';
            };

            recognition.onend = () => {
                audioStatus.classList.add('hidden');
                recordText.textContent = 'Grabar por Voz';
            };

            recordAudioBtn.addEventListener('click', () => {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                }
            });
        } else {
            recordAudioBtn.style.display = 'none'; 
        }

        // Convertir fotos a Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // Envío de datos al Webhook
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading(true);
            hideAlert();

            const payload = {
                mechanic_id: document.getElementById('mechanicId').value,
                car_model: document.getElementById('carModel').value,
                category: document.getElementById('supportType').value,
                description: issueDescription.value,
                timestamp: new Date().toISOString(),
                images: [] 
            };

            try {
                if (evidenceFiles.files.length > 0) {
                    for (let i = 0; i < evidenceFiles.files.length; i++) {
                        const base64Image = await fileToBase64(evidenceFiles.files[i]);
                        payload.images.push(base64Image);
                    }
                }

                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    // NUEVO: Leemos la respuesta que viene de n8n
                    const responseText = await response.text();
                    let finalMessage = "¡Solicitud enviada con éxito!";
                    
                    try {
                        // Intentamos ver si n8n lo mandó como JSON
                        const jsonResponse = JSON.parse(responseText);
                        // Dependiendo de cómo esté configurado n8n, el texto puede venir en 'output', 'text' o directo
                        finalMessage = jsonResponse.output || jsonResponse.text || jsonResponse.message || responseText;
                    } catch (err) {
                        // Si no es JSON, es texto plano, lo usamos directo
                        finalMessage = responseText;
                    }

                    // Mostramos el diagnóstico de la IA en la página
                    showAlert(finalMessage, 'success');
                    
                    // Hacemos scroll hacia arriba para que el usuario vea la respuesta
                    alertBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    
                    // form.reset(); // Descomenta esto si quieres que se limpie el form después de responder
                } else {
                    showAlert('El servidor de n8n respondió con un error (' + response.status + ').', 'error');
                }
            } catch (error) {
                console.error('Error enviando solicitud:', error);
                showAlert('Error de red. Posible bloqueo de CORS o túnel caído.', 'error');
            } finally {
                setLoading(false);
            }
        });

        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                btnText.textContent = 'Analizando diagnóstico...';
                spinner.classList.remove('hidden');
            } else {
                submitBtn.disabled = false;
                btnText.textContent = 'Enviar Solicitud al Servidor';
                spinner.classList.add('hidden');
            }
        }

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.classList.remove('hidden', 'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/30', 'bg-rose-500/10', 'text-rose-400', 'border-rose-500/30');
            
            if (type === 'success') {
                alertBox.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/30');
            } else {
                alertBox.classList.add('bg-rose-500/10', 'text-rose-400', 'border', 'border-rose-500/30');
            }
        }

        function hideAlert() {
            alertBox.classList.add('hidden');
        }
    </script>
</body> 
</html>
